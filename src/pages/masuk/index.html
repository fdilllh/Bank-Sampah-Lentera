<!-- Template HTML layar masuk aplikasi. -->
<main class="login-wrap"><form class="login-card" id="login-form">
  <div class="brand-mark">♻</div><p class="eyebrow">BANK SAMPAH LENTERA</p><h1>Selamat datang</h1><p class="muted">Masuk ke akun Bank Sampah Lentera.</p>
  <label>Alamat email<input name="email" type="email" autocomplete="username" required placeholder="nama@email.com"></label>
  <label>Kata sandi<input name="password" type="password" autocomplete="current-password" required placeholder="Kata sandi"></label>
  <button class="button primary full">{{BUTTON_TEXT}}</button>{{ERROR}}
  <p class="hint">Minta admin membuat akun jika Anda belum terdaftar.</p>
</form></main>
